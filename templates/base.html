{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Femboy Forum</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header class="navbar">
    <div class="container navbar-inner">
        <a href="/" class="nav-logo">femboy_forum</a>

        <nav class="nav-links">
            <a href="{% url 'main_forum:list' %}">Форум</a>
            <a href="{% url 'polls:list' %}">Анкеты</a>
            <a href="{% url 'voting:question_list' %}">Голосования</a>
        </nav>

        <div class="nav-user">
            {% if user.is_authenticated %}
                <a href="{% url 'main_forum:detail_user' user.pk %}">
                    <img src="{{ user.profile_pic.url }}" class="nav-avatar" alt="User">
                </a>
                <form action="{% url 'auth_system:logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline" style="padding: 5px 15px; border-radius: 20px;">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'auth_system:login' %}" class="btn btn-primary">Войти</a>
            {% endif %}
        </div>
    </div>
</header>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
