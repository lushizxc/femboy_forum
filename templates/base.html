<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мой форум{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/forum">Forum</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3"></span>
                    <a href="{% url 'main_forum:detail_user' user.pk%}">{{user.username}}</a>
                    <a class="nav-link" href="{% url 'auth_system:profile_edit' %}">Профиль</a>
                    <form action="{% url 'auth_system:logout' %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link">Выйти</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'auth_system:login' %}">Вход</a>
                    <a class="nav-link" href="{% url 'auth_system:signup' %}">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
