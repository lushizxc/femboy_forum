{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">Удалить опрос</div>
        <div class="card-body">
            <p>Вы уверены что хотите удалить опрос?<strong>"{{ object.title }}"</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да удалить</button>
                <a href="{% url 'polls:list' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
