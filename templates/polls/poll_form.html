{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Новый опрос</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Название опроса</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            <textarea name="description" class="form-control" rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Создать</button>
                        <a href="{% url 'polls:list' %}" class="btn btn-link w-100 mt-2 text-muted">отмена</a>
                    </form>
                </div>
                <div class="card-footer bg-light small text-center">
                    Вопросы та варианты ответов добавьте через <a href="/admin/">админку</a>.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
