{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 700px;">
    <div class="card">
        <h2 style="margin-top: 0;">Новый опрос</h2>
        <hr>
        <form method="post">
            {% csrf_token %}

            <div>
                <label>Название опроса</label>
                <input type="text" name="title" required>
            </div>

            <div>
                <label>Описание</label>
                <textarea name="description" rows="4"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Создать</button>
                <a href="{% url 'polls:list' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>

        <div style="margin-top: 20px; font-size: 0.9rem; color: #888; text-align: center;">
            Вопросы и варианты ответов добавляются через <a href="/admin/">админку</a>.
        </div>
    </div>
</div>
{% endblock %}
