{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    {% if object %}Редактирование опроса{% else %}Новый опрос{% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'voting:question_list' %}" class="btn btn-secondary">Отмена</a>
                        <button type="submit" class="btn btn-success px-4">Сохранить</button>
                    </div>
                </form>
            </div>
            {% if not object %}
            <div class="card-footer text-muted small">
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
