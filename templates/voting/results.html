{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Результаты: {{ question.title }}</h2>
    <a href="{% url 'voting:question_list' %}" class="btn btn-sm btn-outline-secondary mb-4">← Назад к списку</a>

    <div class="card shadow-sm">
        <div class="card-body">
            <ul class="list-group list-group-flush">
                {% for choice in question.choices.all %}
                <li class="list-group-item border-0">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="fw-bold">{{ choice.content }}</span>
                        <span class="badge bg-primary rounded-pill">{{ choice.vote_set.count }} голосов</span>
                    </div>
                    
                    <div class="progress" style="height: 10px;">
                        <div class="progress-bar bg-info" role="progressbar" 
                             style="width: 50%" 
                             aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
                             </div>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>
        <div class="card-footer">
            <a href="{% url 'voting:question_detail' question.id %}" class="btn btn-warning btn-sm">Переголосовать</a>
        </div>
    </div>
</div>
{% endblock %}
