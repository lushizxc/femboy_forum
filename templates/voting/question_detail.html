{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="card-title mb-3">{{ question.title }}</h2>
                <p class="card-text text-muted mb-4">{{ question.content }}</p>

                {% if error_message %}
                    <div class="alert alert-danger" role="alert">
                        {{ error_message }}
                    </div>
                {% endif %}

                <form action="{% url 'voting:vote' question.id %}" method="post">
                    {% csrf_token %}
                    
                    <div class="list-group mb-4">
                        {% for choice in question.choices.all %}
                        <label class="list-group-item list-group-item-action d-flex align-items-center">
                            <input class="form-check-input me-3" type="radio" name="choice" value="{{ choice.id }}" id="choice{{ forloop.counter }}">
                            <span class="fs-5">{{ choice.content }}</span>
                        </label>
                        {% endfor %}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Голосовать</button>
                        <a href="{% url 'voting:results' question.id %}" class="btn btn-outline-secondary">Посмотреть результаты</a>
                    </div>
                </form>
            </div>
            <div class="card-footer text-muted text-center">
                Автор: {{ question.author.username }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
